<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://budget-app-x2s2.onrender.com https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4fb">
<title>Бюджет</title>
<script>
// Тема: по умолчанию светлая (системную не учитываем), если пользователь выбрал тёмную — помним.
(function(){
  var t='light';
  try{var s=localStorage.getItem('budget_theme');if(s==='dark'||s==='light')t=s;}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',t==='dark'?'#05060a':'#f3f4fb');
})();
</script>
<style>
:root{color-scheme:light;--bg:#f3f4fb;--status-bar-bg:#eceefa;--status-bar-fade:#f0f1fa;--card:#fff;--card-grad:linear-gradient(180deg,#ffffff 0%,#fafbff 100%);--text:#1f2340;--muted:#7b8199;--blue:#5267e8;--pink:#ee6f9c;--teal:#20a99b;--violet:#7d6be8;--line:#e9ecf6;--input-bg:#f5f6fc;--input-text:#1f2340;--shadow:inset 0 1px 0 rgba(255,255,255,.95),0 14px 32px -14px rgba(60,72,150,.24),0 2px 6px rgba(60,72,150,.06);--card-border:rgba(125,135,170,.13);--aura:radial-gradient(60% 38% at 0% 0%,rgba(130,145,255,.20),transparent 70%),radial-gradient(55% 34% at 100% 8%,rgba(255,160,200,.17),transparent 70%),radial-gradient(70% 42% at 50% 105%,rgba(110,215,200,.15),transparent 70%);--nav-highlight:#edf1ff;--nav-border:rgba(128,136,158,.18);--nav-active:#e3e8ff;--icon-bg:#f0f3fb;--modal-bg:#fff;--modal-content:#f4f6fb;--close-bg:#eef2fb;--close-text:#3c4664}
:root[data-theme="dark"]{color-scheme:dark;--bg:#05060a;--status-bar-bg:#05060a;--status-bar-fade:#05060a;--card:#12141c;--card-grad:linear-gradient(180deg,#171a24 0%,#10121a 100%);--text:#f2f4fb;--muted:#9aa1b8;--blue:#8f9bff;--pink:#ff7fa9;--teal:#45e0cb;--violet:#a898ff;--line:#262a38;--input-bg:#1a1d29;--input-text:#f2f4fb;--shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 40px -16px rgba(0,0,0,.9),0 2px 8px rgba(0,0,0,.5);--card-border:rgba(255,255,255,.07);--aura:radial-gradient(60% 34% at 0% 0%,rgba(110,125,255,.15),transparent 70%),radial-gradient(55% 30% at 100% 5%,rgba(255,110,170,.09),transparent 70%),radial-gradient(70% 40% at 50% 108%,rgba(60,225,200,.08),transparent 70%);--nav-highlight:rgba(255,255,255,.06);--nav-border:rgba(151,160,182,.14);--nav-active:rgba(143,155,255,.18);--icon-bg:#1d2130;--modal-bg:#14161f;--modal-content:#1a1d29;--close-bg:#262a3a;--close-text:#eef2ff}
:root{--bd-on-accent:#fff}
:root[data-theme="dark"]{--bd-on-accent:#0b1020}

*{box-sizing:border-box}
[hidden]{display:none!important}
html::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--aura)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
body::before{position:fixed;z-index:25;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 6px);background:linear-gradient(to bottom,var(--status-bar-bg) 0%,transparent 100%);content:"";pointer-events:none}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px}
.page-heading{font-size:25px;font-weight:800;letter-spacing:-.7px;margin:0}
.logout{flex:none;height:40px;padding:0 15px;border-radius:13px;border:1px solid var(--card-border);background:var(--card-grad);color:var(--muted);font-size:14px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1)}
.logout:active{transform:scale(.95)}

.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:145px;color:var(--muted);font-size:13px;text-align:center}
.spinner{width:39px;height:39px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
.login-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;padding:28px 22px 22px;background:var(--card-grad);border:1px solid var(--card-border);border-radius:25px;box-shadow:var(--shadow)}
.login-ico{width:62px;height:62px;margin:0 auto;border-radius:21px;display:grid;place-items:center;font-size:30px;background:var(--icon-bg)}
.login-card h1{margin:0 0 6px;text-align:center;font-size:24px;font-weight:800;letter-spacing:-.6px}
.login-card .bd-add{margin-top:6px}
.login-error{margin:0;min-height:1.3em;text-align:center;font-size:13px;color:#cf3434}

.value-input{min-width:0;flex:1;border:1px solid var(--line);border-radius:13px;background:var(--input-bg);padding:13px 14px;color:var(--input-text);-webkit-text-fill-color:var(--input-text);caret-color:var(--blue);font-size:15px}
.value-input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:1}
.value-input:focus{border-color:var(--blue);outline:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;color:var(--muted);text-align:center}
.field .value-input{display:block;width:100%;max-width:100%;min-width:0;font-size:16px;min-height:44px;-webkit-appearance:none;appearance:none;text-align:center;margin:0}
.toast{font-size:12px;color:var(--muted);min-height:16px;margin:8px 2px 0}
.toast:empty{display:none}
.toast.success{color:#168653}
.toast.error{color:#cf3434}

.modal-backdrop{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 14px) 14px 14px;background:rgba(18,24,45,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.modal-backdrop.visible{display:flex;animation:fade .18s ease}
.modal{width:100%;max-width:420px;max-height:calc(100dvh - env(safe-area-inset-top) - 28px);overflow-y:auto;display:flex;flex-direction:column;background:var(--modal-bg);color:var(--text);border-radius:25px;padding:16px 16px 14px;box-shadow:0 25px 80px rgba(0,0,0,.2)}
.modal-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.modal-icon{width:38px;height:38px;border-radius:15px;background:var(--icon-bg);display:grid;place-items:center;font-size:19px}
.modal-title{font-size:19px;font-weight:800}
.form-body{display:flex;flex-direction:column;gap:8px}
.form-actions{display:flex;gap:10px;margin-top:2px}
.btn-cancel{flex:none;min-height:46px;padding:0 16px;border:1px solid var(--line);border-radius:13px;background:var(--input-bg);color:var(--text);font-size:15px;font-weight:700;cursor:pointer;transition:transform .38s cubic-bezier(.34,1.5,.4,1)}
.btn-cancel:active{transform:scale(.95)}
.btn-cancel:disabled{opacity:.5}

.sheet-backdrop{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;padding:14px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(18,24,45,.48);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.sheet-backdrop.visible{display:flex;animation:fade .18s ease}
.sheet{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;animation:sheetUp .28s cubic-bezier(.22,1,.36,1)}
.sheet-card{overflow:hidden;background:var(--modal-bg);border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.sheet-title{padding:16px 18px 2px;text-align:center;font-size:15px;font-weight:800}
.sheet-text{padding:4px 18px 14px;text-align:center;font-size:13px;line-height:1.45;color:var(--muted)}
.sheet-btns{display:flex;flex-direction:column}
.sheet-btn{border:0;border-top:1px solid var(--line);background:transparent;color:var(--blue);padding:15px 12px;font-size:17px;font-weight:650;cursor:pointer}
.sheet-btn:active{background:var(--input-bg)}
.sheet-btn.danger{color:#e5484d}
.sheet-cancel{border:0;border-radius:22px;background:var(--modal-bg);color:var(--blue);padding:15px 12px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 25px 80px rgba(0,0,0,.25)}
.sheet-cancel:active{background:var(--input-bg)}

/* ---------- бюджет ---------- */
/* ============================================================
   БЮДЖЕТ: кнопка на главной, шапка периода, список статей, формы
   ============================================================ */

:root{--bd-ok:#168653;--bd-over:#cf3434;--bd-over-bg:rgba(207,52,52,.10)}
:root[data-theme="dark"]{--bd-ok:#48cc83;--bd-over:#ff7474;--bd-over-bg:rgba(255,116,116,.14)}

.bd-hero{background:var(--card-grad);border:1px solid var(--card-border);border-radius:24px;padding:14px 16px 16px;box-shadow:var(--shadow);margin-bottom:12px;transition:background .3s,border-color .3s}
.bd-hero.over{background:linear-gradient(180deg,var(--bd-over-bg) 0%,transparent 70%),var(--card-grad);border-color:rgba(207,52,52,.28)}
.bd-month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.bd-month-title{font-size:19px;font-weight:800;letter-spacing:-.3px;text-align:center;flex:1}
.bd-step{flex:none;width:40px;height:40px;border-radius:13px;border:1px solid var(--card-border);background:var(--input-bg);color:var(--text);font-size:23px;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1),opacity .2s}
.bd-step:disabled{opacity:.28;cursor:default}
.bd-step:active:not(:disabled){transform:scale(.9)}
.bd-tabs{display:flex;gap:4px;padding:3px;border-radius:15px;background:var(--input-bg);margin-bottom:16px}
.bd-tab{flex:1;min-width:0;min-height:50px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.bd-tab span{font-size:15px;font-weight:750}
.bd-tab small{font-size:11px;font-weight:600;opacity:.8}
.bd-tab.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(60,72,150,.16)}
.bd-label{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.bd-balance{text-align:center;margin-bottom:14px}
.bd-big{display:block;margin-top:2px;font-size:clamp(30px,10vw,40px);font-weight:800;letter-spacing:-1.2px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.bd-hero.ok .bd-big{color:var(--bd-ok)}
.bd-hero.over .bd-big{color:var(--bd-over)}
.bd-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd-stat{display:block;text-align:left;border:0;border-radius:15px;background:var(--input-bg);padding:10px 12px;color:var(--text);font:inherit;min-width:0}
button.bd-stat{cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1)}
button.bd-stat:active{transform:scale(.97)}
.bd-stat b{display:block;margin-top:2px;font-size:clamp(16px,5.2vw,21px);font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-stat .bd-label i{font-style:normal;margin-left:4px;opacity:.7}
.bd-extra{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;margin-top:10px;padding:10px 12px;border:0;border-radius:15px;background:var(--input-bg);color:var(--text);font:inherit;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1)}
.bd-extra:active{transform:scale(.98)}
.bd-extra span{font-size:13px;font-weight:700;color:var(--muted)}
.bd-extra b{font-size:16px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;color:var(--bd-ok);white-space:nowrap}
.bd-bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:14px}
.bd-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#7d8cf5,#5267e8);transition:width .5s cubic-bezier(.22,1,.36,1)}
.bd-hero.over .bd-bar i{background:linear-gradient(90deg,#ff8c8c,#e5484d)}

.bd-card{background:var(--card-grad);border:1px solid var(--card-border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.bd-card-head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 10px;font-size:16px;font-weight:800}
.bd-card-head span{font-size:12px;font-weight:600;color:var(--muted)}
.bd-list{position:relative}
.bd-row{position:relative;display:flex;align-items:center;gap:6px;height:62px;padding:0 15px 0 2px;background:var(--card);border-top:1px solid var(--line);cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .2s,opacity .2s}
.bd-list.noanim .bd-row{transition:none}
.bd-row:active{background:var(--input-bg)}
.bd-row.lifted{z-index:6;border-radius:16px;border-top-color:transparent;box-shadow:0 14px 34px rgba(0,0,0,.24),0 0 0 .5px var(--card-border);transition:box-shadow .2s;cursor:grabbing;background:var(--card)}
/* строку перетаскивают долгим нажатием в любом месте (стили .holding и .lifted ниже) */
.bd-name{flex:1;min-width:0}
.bd-name b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-name small{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-sum{flex:none;max-width:44%;font-size:17px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-row.zero .bd-name b,.bd-row.zero .bd-sum{color:var(--muted);font-weight:650}
.bd-row.zero{opacity:.72}
.bd-empty{padding:20px 18px 22px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:14px;line-height:1.45}

.bd-add,.bd-month-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;font-size:16px;font-weight:750;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1),opacity .2s}
.bd-add{margin-top:12px;border:0;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 62%),var(--blue);color:var(--bd-on-accent,#fff);box-shadow:0 10px 22px -10px rgba(0,0,0,.4)}
@supports (color:color-mix(in srgb,red,blue)){.bd-add,.bd-save{box-shadow:0 10px 22px -10px color-mix(in srgb,var(--blue) 75%,transparent)}}
.bd-month-add{margin-top:10px;min-height:48px;border:1px solid var(--card-border);background:var(--card-grad);color:var(--text);font-size:15px;box-shadow:var(--shadow)}
.bd-add:active,.bd-month-add:active{transform:scale(.97)}
.bd-add:disabled,.bd-month-add:disabled{opacity:.55;pointer-events:none}
.bd-plus{font-size:22px;font-weight:600;line-height:1;margin-top:-2px}

.bd-first,.bd-ghost{padding:22px 18px;text-align:center}
.bd-ghost{padding:14px 4px 6px}
.bd-ghost h3{margin:0 0 6px;font-size:19px;font-weight:800;letter-spacing:-.3px}
.bd-ghost p{margin:0 0 4px;font-size:14px;line-height:1.45;color:var(--muted)}
.bd-ghost .bd-ico{width:56px;height:56px;margin:0 auto 12px;border-radius:19px;display:grid;place-items:center;font-size:28px;background:var(--icon-bg)}
.bd-hero.ghost .bd-month{margin-bottom:4px}
.bd-first .bd-ico{width:56px;height:56px;margin:0 auto 12px;border-radius:19px;display:grid;place-items:center;font-size:28px;background:var(--icon-bg)}
.bd-first h3{margin:0 0 6px;font-size:19px;font-weight:800}
.bd-first p{margin:0 0 6px;font-size:14px;line-height:1.45;color:var(--muted)}
.bd-error{padding:22px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.45}
.bd-error .bd-month-add{width:auto;display:inline-flex;padding:0 22px;margin-top:14px}

/* итоги месяца: кольцо, сводка, полосы по зарплатам */
.bd-sumcard{margin-top:12px;padding-bottom:6px}
.bd-sumtop{display:flex;align-items:center;gap:16px;padding:2px 16px 14px}
.bd-ring{position:relative;flex:none;width:104px;height:104px}
.bd-ring svg{display:block;width:100%;height:100%}
.bd-ring circle{fill:none;stroke-width:10}
.bd-ring .trk{stroke:var(--line)}
.bd-ring .val{stroke:#5267e8;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1)}
.bd-sumcard.over .bd-ring .val{stroke:var(--bd-over)}
.bd-ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bd-ring-in b{font-size:22px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.bd-ring-in small{margin-top:1px;font-size:11px;font-weight:600;color:var(--muted)}
.bd-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.bd-lg{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.bd-lg span{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.bd-lg b{font-size:15px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-lg.tot{margin-top:1px;padding-top:9px;border-top:1px solid var(--line)}
.bd-lg.tot b{font-size:18px}
.bd-sumcard.ok .bd-lg.tot b{color:var(--bd-ok)}
.bd-sumcard.over .bd-lg.tot b{color:var(--bd-over)}
.bd-mrows{border-top:1px solid var(--line)}
.bd-mrow{padding:12px 16px 13px;border-bottom:1px solid var(--line)}
.bd-mrow:last-child{border-bottom:0}
.bd-mrow-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.bd-mrow-top span{font-size:14px;font-weight:700;color:var(--muted)}
.bd-mrow.on .bd-mrow-top span{color:var(--text)}
.bd-mrow-top em{font-style:normal;font-size:16px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.bd-mrow.ok em{color:var(--bd-ok)}
.bd-mrow.over em{color:var(--bd-over)}
.bd-mrow .bd-bar{height:6px;margin-top:8px}
.bd-mrow:not(.on) .bd-bar i{opacity:.55}
.bd-mrow.over .bd-bar i{background:linear-gradient(90deg,#ff8c8c,#e5484d)}
.bd-mrow-sub{margin-top:6px;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* формы и подтверждения */
.bd-save{flex:1;min-height:46px;font-size:16px;border:0;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 62%),var(--blue);color:var(--bd-on-accent,#fff)}
.bd-seg{display:flex;gap:4px;padding:3px;border-radius:14px;background:var(--input-bg);border:1px solid var(--line)}
.bd-seg button{flex:1;min-height:40px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.bd-seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(60,72,150,.16)}
.bd-hint{margin:-2px 2px 0;font-size:12px;line-height:1.4;color:var(--muted);text-align:center}
.value-input.bd-left{text-align:left;padding-left:14px;padding-right:14px}
#budgetFormBackdrop input[type="month"]{overflow:hidden;padding-left:10px;padding-right:10px}
#budgetFormBackdrop input[type="month"]::-webkit-date-and-time-value{text-align:center;margin:0;min-width:0}
.bd-links{display:flex;justify-content:center;gap:6px;margin-top:10px}
.bd-links:empty{display:none}
.bd-link{flex:1;min-height:42px;border:0;border-radius:12px;background:transparent;color:var(--blue);font-size:14.5px;font-weight:700;cursor:pointer}
.bd-link.danger{color:var(--bd-over,#cf3434)}
.bd-link:active{background:var(--input-bg)}
.bd-link:disabled{opacity:.5}

/* ============================================================
   Дополнения: шапка, тема, отметка «выполнено», мерцание, автозаполнение
   ============================================================ */
:root{--hold-tint:rgba(82,103,232,.16)}
:root[data-theme="dark"]{--hold-tint:rgba(143,155,255,.26)}

/* шапка: иконки рядом с «Выйти» */
.page-heading{min-width:0}
.topbar-actions{flex:none;display:flex;align-items:center;gap:8px}
.icon-btn{flex:none;width:40px;height:40px;padding:0;border-radius:13px;border:1px solid var(--card-border);background:var(--card-grad);color:var(--muted);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.34,1.5,.4,1)}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{display:block;width:22px;height:22px}
.icon-btn.sheet svg{width:26px;height:26px}
.theme-btn .ico-sun{display:none}
:root[data-theme="dark"] .theme-btn .ico-sun{display:block}
:root[data-theme="dark"] .theme-btn .ico-moon{display:none}

/* вход: подписи полей прижаты к левому краю */
.login-card .field>span{text-align:left;padding-left:2px}

/* автозаполнение браузера: свой фон и цвет текста вместо жёлтой подсветки */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,input:-webkit-autofill:active{-webkit-text-fill-color:var(--input-text)!important;caret-color:var(--input-text);-webkit-box-shadow:0 0 0 1000px var(--input-bg) inset!important;box-shadow:0 0 0 1000px var(--input-bg) inset!important;border-color:var(--line);transition:background-color 600000s 0s,color 600000s 0s}
input:autofill{-webkit-text-fill-color:var(--input-text)!important;box-shadow:0 0 0 1000px var(--input-bg) inset!important}

/* отметка «выполнено» */
.bd-check{flex:none;width:48px;height:62px;border:0;padding:0;background:transparent;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bd-check svg{display:block;width:26px;height:26px;overflow:visible;transition:transform .3s cubic-bezier(.34,1.5,.4,1)}
.bd-check:active svg{transform:scale(.86)}
.bd-check .ring{fill:transparent;stroke:var(--muted);stroke-width:1.8;opacity:.75;transition:fill .2s,stroke .2s,opacity .2s}
.bd-check .tick{fill:none;stroke:var(--bd-on-accent,#fff);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .28s ease .05s}
.bd-row.done .bd-check .ring{fill:var(--bd-ok);stroke:var(--bd-ok);opacity:1}
.bd-row.done .bd-check .tick{stroke-dashoffset:0}
.bd-row.done .bd-name b{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted);font-weight:650}
.bd-row.done .bd-sum{color:var(--muted);font-weight:650}
.bd-row.done{opacity:.82}

/* мерцание строки: держишь нажатым — через 2 секунды строку можно тащить */
.bd-row.holding{animation:bdShimmer .6s ease-in-out infinite}
@keyframes bdShimmer{
 0%,100%{box-shadow:inset 0 0 0 0 var(--hold-tint),inset 0 0 0 0 var(--blue)}
 50%{box-shadow:inset 0 0 0 80px var(--hold-tint),inset 0 0 0 2px var(--blue)}
}

/* кнопки в окне статьи: аккуратно закруглены */
.bd-save,.btn-cancel{border-radius:16px}
.bd-save{font-weight:750;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.5,.4,1),opacity .2s}
.bd-save:active{transform:scale(.97)}
.bd-save:disabled{opacity:.55}

</style>
</head>
<body>
<div id="bootView" class="boot"></div>

<main id="loginView" class="login-wrap" hidden>
  <form class="login-card" id="loginForm" aria-label="Вход">
    <label class="field"><span>Логин</span><input class="value-input bd-left" id="loginUser" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label class="field"><span>Пароль</span><input class="value-input bd-left" id="loginPass" type="password" autocomplete="current-password" required></label>
    <button class="bd-add" type="submit" id="loginBtn">Войти</button>
    <p class="login-error" id="loginError"></p>
  </form>
</main>

<div class="app" id="budgetView" hidden>
  <div class="topbar">
    <h1 class="page-heading">Бюджет</h1>
    <div class="topbar-actions">
      <button class="icon-btn theme-btn" id="themeToggle" type="button" aria-label="Включить тёмную тему" title="Сменить тему">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
      <a class="icon-btn sheet" id="sheetLink" href="#" target="_blank" rel="noopener noreferrer" aria-label="Открыть таблицу" title="Открыть таблицу" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="xlG" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3fcf8e"/><stop offset="1" stop-color="#0f7b43"/></linearGradient></defs><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="url(#xlG)"/><path d="M8.3 8.2l7.4 7.6M15.7 8.2l-7.4 7.6" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/></svg>
      </a>
      <button class="logout" id="logout" type="button">Выйти</button>
    </div>
  </div>
  <div id="budgetBody"></div>
</div>

<div class="modal-backdrop" id="budgetFormBackdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="bdFormTitle">
    <div class="modal-top">
      <div class="modal-icon" id="bdFormIcon">💰</div>
      <div class="modal-title" id="bdFormTitle">Статья</div>
    </div>
    <div class="form-body" id="bdFormBody"></div>
    <div class="toast" id="bdFormToast"></div>
    <div class="form-actions">
      <button class="btn-cancel" id="bdFormCancel" type="button">Отмена</button>
      <button class="bd-save" id="bdFormSave" type="button">Сохранить</button>
    </div>
    <div class="bd-links" id="bdFormLinks"></div>
  </section>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-card">
      <div class="sheet-title" id="sheetTitle"></div>
      <div class="sheet-text" id="sheetText"></div>
      <div class="sheet-btns" id="sheetBtns"></div>
    </div>
    <button class="sheet-cancel" id="sheetCancel" type="button">Отмена</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setToast(el,message,type){el.textContent=message||'';el.className='toast'+(type?' '+type:'');}
function loadingContent(text){return '<div class="loader-wrap"><div class="spinner"></div><div>'+escapeHtml(text)+'</div></div>';}
function hideKeyboard(){const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();}
const vibrate=pattern=>{try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){}};
const uiHaptic=kind=>vibrate(kind==='error'?[20,40,20]:12);
const selectionHaptic=()=>vibrate(6);

// ---------- тема: по умолчанию светлая, выбор запоминается ----------
const THEME_KEY='budget_theme';
function applyTheme(theme,save){
  document.documentElement.setAttribute('data-theme',theme);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',theme==='dark'?'#05060a':'#f3f4fb');
  const btn=$('themeToggle');
  if(btn){
    const label=theme==='dark'?'Включить светлую тему':'Включить тёмную тему';
    btn.setAttribute('aria-label',label);
    btn.title=label;
  }
  if(save){try{localStorage.setItem(THEME_KEY,theme);}catch(e){}}
}
applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light',false);
$('themeToggle').addEventListener('click',()=>{
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark',true);
  selectionHaptic();
});

// ---------- вход по логину и паролю (как было) ----------
const API="https://script.google.com/macros/s/AKfycbw2S8nKASSRnuIu_gW60rnr26mUgySNp1Kk0yxG91EcId_gBSqcpErzmnrIjX98_UUb/exec";
const TOKEN_KEY="budget_token";

function getToken(){try{return localStorage.getItem(TOKEN_KEY);}catch(e){return null;}}
function setToken(t){
  try{
    if(t)localStorage.setItem(TOKEN_KEY,t);
    else localStorage.removeItem(TOKEN_KEY);
  }catch(e){}
}

async function api(path,options={}){
  const method=(options.method||"GET").toUpperCase();
  const token=getToken();
  const payload={
    method,
    path,
    token:token||"",
    body:options.body||"{}"
  };
  const res=await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"text/plain"},
    body:JSON.stringify(payload)
  });
  const proxy=await res.json();
  const status=Number(proxy.status||502);
  let data=null;
  try{data=JSON.parse(proxy.body);}catch(e){data={error:proxy.body||"Proxy error"};}
  return {status,ok:status>=200&&status<300,data};
}

// запрос бюджета: возвращает data, при ошибке бросает Error со status; 401 — сразу на экран входа
async function request(path,options){
  const {status,ok,data}=await api(path,options);
  if(status===401){
    onSessionExpired();
    const error=new Error((data&&data.error)||'Требуется вход');
    error.status=401;
    throw error;
  }
  if(!ok||!data||!data.ok){
    const error=new Error((data&&data.error)||('Ошибка '+status));
    error.status=status;
    throw error;
  }
  return data.data;
}
const get=path=>request(path);
const post=(path,payload)=>request(path,{method:'POST',body:JSON.stringify(payload||{})});

function showView(name){
  ['boot','login','budget'].forEach(id=>{$(id+'View').hidden=id!==name;});
}
function showLogin(message){
  showView('login');
  $('loginError').textContent=message||'';
  $('loginPass').value='';
}
function showBudget(){
  showView('budget');
  Budget.open();
}
function onSessionExpired(){
  if(!$('loginView').hidden)return;
  setToken(null);
  Budget.close();
  showLogin('Сессия закончилась. Войдите снова.');
}

$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const errP=$('loginError');
  const btn=$('loginBtn');
  errP.textContent='';
  btn.disabled=true;
  try{
    const {status,ok,data}=await api('/api/login',{
      method:'POST',
      body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})
    });
    if(ok&&data&&data.ok){
      setToken(data.token);
      showBudget();
    }else{
      errP.textContent=(data&&data.error)||('Ошибка '+status);
    }
  }catch(err){
    errP.textContent='Сеть недоступна';
  }finally{
    btn.disabled=false;
  }
});

$('logout').addEventListener('click',async()=>{
  try{await api('/api/logout',{method:'POST'});}catch(e){}
  setToken(null);
  Budget.close();
  showLogin();
});

async function boot(){
  showView('boot');
  $('bootView').innerHTML=loadingContent('Загрузка…');
  const wake=setTimeout(()=>{
    const label=document.querySelector('#bootView .loader-wrap div:last-child');
    if(label)label.textContent='Сервер просыпается, это может занять до минуты…';
  },6000);
  try{
    const {ok,data}=await api('/api/me');
    clearTimeout(wake);
    if(ok&&data&&data.authenticated)showBudget();
    else showLogin();
  }catch(err){
    clearTimeout(wake);
    $('bootView').innerHTML='<section class="bd-card bd-error">Не удалось связаться с сервером<br><button class="bd-month-add" type="button" id="bootRetry">Повторить</button></section>';
  }
}
$('bootView').addEventListener('click',e=>{if(e.target.closest('#bootRetry'))boot();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)Budget.refresh();});

// ============================================================
// БЮДЖЕТ: зарплатные периоды и статьи расходов (лист cost)
// ============================================================
(function(){
'use strict';
const $=id=>document.getElementById(id);
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WEEKDAYS=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MAX_AHEAD=24;    // сколько месяцев вперёд можно добавить за раз (как на сервере)
const S={state:null,sel:null,ghost:null,busy:false,loading:false,seq:0,dragging:false,pendingRender:false,noClick:false,doneOps:0};
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const money=n=>nf.format(n)+'\u00a0₽';
const signed=n=>n>0?'+'+money(n):money(n);      // положительный остаток — со знаком «+»
const r2=n=>Math.round(n*100)/100;
const esc=value=>escapeHtml(value);
const isOpen=()=>!$('budgetView').hidden;

// ---------- даты ----------
function todayIso(){
 // «сегодня» считаем по Москве, как и на сервере
 try{
  const s=new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Moscow'});
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
 }catch(e){}
 const d=new Date();
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dayInfo(iso){
 const [y,m,d]=iso.split('-').map(Number);
 return {y,m,d,wd:new Date(Date.UTC(y,m-1,d)).getUTCDay()};
}
const dayLabel=iso=>{const i=dayInfo(iso);return i.d+' '+MONTHS_GEN[i.m-1];};
const monthTitle=key=>{const [y,m]=key.split('-').map(Number);return MONTHS[m-1]+' '+y;};
const monthTitleGen=key=>{const [y,m]=key.split('-').map(Number);return MONTHS_GEN[m-1]+' '+y;};
const monthIdx=key=>{const [y,m]=key.split('-').map(Number);return y*12+m-1;};
const keyOf=i=>Math.floor(i/12)+'-'+String(i%12+1).padStart(2,'0');
const monthWord=n=>plural(n,['месяц','месяца','месяцев']);
function plural(n,forms){
 const a=Math.abs(n)%100,b=a%10;
 return a>10&&a<20?forms[2]:b===1?forms[0]:b>=2&&b<=4?forms[1]:forms[2];
}

// ---------- состояние ----------
// Открываем ближайшую будущую зарплату (14-го — зарплату 17-го); если будущих нет — последнюю.
function defaultSel(periods){
 const today=todayIso();
 const upcoming=periods.find(p=>p.pay_date>=today);
 return (upcoming||periods[periods.length-1]).pay_date;
}
// Ссылка на Google Таблицу в шапке: показываем, только если адрес точно похож на ссылку на таблицу Google.
function setSheetLink(url){
 const a=$('sheetLink');
 if(typeof url==='string'&&/^https:\/\/docs\.google\.com\/spreadsheets\/d\/[\w-]+\/edit(#gid=\d+)?$/.test(url)){
  a.href=url;
  a.hidden=false;
 }else{
  a.hidden=true;
  a.removeAttribute('href');
 }
}
function adopt(data,focus){
 S.state=data;
 setSheetLink(data.sheet_url);
 const dates=data.periods.map(p=>p.pay_date);
 if(focus&&dates.includes(focus)){S.sel=focus;S.ghost=null;return;}
 // пока смотрели «ещё не созданный» месяц, его могли создать — тогда показываем уже настоящий
 if(S.ghost&&(!dates.length||data.periods.some(p=>p.month===S.ghost)))S.ghost=null;
 if(!S.sel||!dates.includes(S.sel))S.sel=dates.length?defaultSel(data.periods):null;
}
function monthBounds(){
 const months=S.state.periods.map(p=>p.month);
 return {first:months[0],last:months[months.length-1]};
}
const current=()=>S.state?S.state.periods.find(p=>p.pay_date===S.sel)||null:null;

// ---------- отрисовка ----------
function monthNavHtml(key){
 const {first,last}=monthBounds();
 const i=monthIdx(key);
 return '<div class="bd-month"><button class="bd-step" type="button" data-act="prev" aria-label="Предыдущий месяц"'+(i<=monthIdx(first)?' disabled':'')+'>‹</button>'
  +'<div class="bd-month-title">'+monthTitle(key)+'</div>'
  +'<button class="bd-step" type="button" data-act="next" aria-label="Следующий месяц"'+(i>=monthIdx(last)+MAX_AHEAD?' disabled':'')+'>›</button></div>';
}
function heroHtml(p){
 const periods=S.state.periods;
 const inMonth=periods.filter(x=>x.month===p.month);
 const over=p.balance<0;
 const cls=over?'over':(p.balance>0?'ok':'');
 const pct=p.income>0?Math.min(100,Math.round(p.expenses/p.income*100)):(p.expenses>0?100:0);
 const tabs=inMonth.map(x=>'<button class="bd-tab'+(x.pay_date===p.pay_date?' on':'')+'" type="button" data-act="tab" data-date="'+x.pay_date+'"><span>'+dayLabel(x.pay_date)+'</span><small>'+WEEKDAYS[dayInfo(x.pay_date).wd]+'</small></button>').join('');
 return '<section class="bd-hero '+cls+'">'+monthNavHtml(p.month)
  +'<div class="bd-tabs">'+tabs+'</div>'
  +'<div class="bd-balance"><span class="bd-label">'+(over?'Превышение расходов':'Остаток')+'</span><span class="bd-big">'+signed(p.balance)+'</span></div>'
  +'<div class="bd-pair"><button class="bd-stat" type="button" data-act="salary" aria-label="Изменить зарплату"><span class="bd-label">Зарплата<i>✎</i></span><b>'+money(p.salary)+'</b></button>'
  +'<div class="bd-stat"><span class="bd-label">Расходы</span><b>'+money(p.expenses)+'</b></div></div>'
  +(p.extra>0?'<button class="bd-extra" type="button" data-act="salary" aria-label="Изменить доп. заработок"><span>Доп. заработок</span><b>+'+money(p.extra)+'</b></button>':'')
  +'<div class="bd-bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div></section>';
}
// Месяц, которого ещё нет в таблице: пустой экран с кнопкой «Добавить».
// Если до него несколько новых месяцев — добавятся все по порядку.
function ghostHtml(key){
 const {last}=monthBounds();
 const n=monthIdx(key)-monthIdx(last);
 const many=n>1;
 const range=monthTitle(keyOf(monthIdx(last)+1))+' — '+monthTitle(key);
 return '<section class="bd-hero ghost">'+monthNavHtml(key)
  +'<div class="bd-ghost"><div class="bd-ico">🗓️</div><h3>'+monthTitle(key)+' ещё не создан</h3>'
  +'<p>'+(many?'Добавятся все месяцы по порядку: '+range+' ('+n+' '+monthWord(n)+'). ':'')
  +'Постоянные статьи и зарплаты скопируются из '+monthTitleGen(last)+(many?' по цепочке':'')+', потом их можно изменить.</p>'
  +'<button class="bd-add" type="button" data-act="create" data-month="'+key+'"><span class="bd-plus">+</span>'+(many?'Добавить '+n+' '+monthWord(n):'Добавить месяц')+'</button></div></section>';
}
// Итоги месяца: кольцо «сколько зарплат потрачено», сводка и полоса по каждой зарплате.
function summaryHtml(p){
 const inMonth=S.state.periods.filter(x=>x.month===p.month);
 const sal=r2(inMonth.reduce((a,x)=>a+x.salary,0));
 const ext=r2(inMonth.reduce((a,x)=>a+x.extra,0));
 const inc=r2(sal+ext);
 const exp=r2(inMonth.reduce((a,x)=>a+x.expenses,0));
 const bal=r2(inc-exp);
 const tone=bal<0?'over':(bal>0?'ok':'');
 const pct=inc>0?exp/inc*100:(exp>0?100:0);
 const C=2*Math.PI*40,off=C*(1-Math.min(100,pct)/100);
 const rows=inMonth.map(x=>{
  const t=x.balance<0?'over':(x.balance>0?'ok':'');
  const w=x.income>0?Math.min(100,Math.round(x.expenses/x.income*100)):(x.expenses>0?100:0);
  return '<div class="bd-mrow '+t+(x.pay_date===p.pay_date?' on':'')+'"><div class="bd-mrow-top"><span>'+dayLabel(x.pay_date)+'</span><em>'+signed(x.balance)+'</em></div>'
   +'<div class="bd-bar" aria-hidden="true"><i style="width:'+w+'%"></i></div>'

// ---------- запросы ----------
function newRequestId(){
 if(window.crypto&&typeof crypto.randomUUID==='function')return crypto.randomUUID();
 return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);
}
function errText(error){
 const text=error&&error.message?String(error.message):'';
 if(!text||/failed to fetch|networkerror|load failed|network request/i.test(text))return 'Нет связи с сервером. Попробуй ещё раз.';
 return text;
}
function call(path,extra){
 // request_id нужен серверу, чтобы повторная отправка того же действия не выполнилась дважды
 return post('/api/budget/'+path,{...extra,request_id:newRequestId()});
}
function notify(text){
 return ask('Не получилось',text,[{id:'ok',text:'Понятно'}]);
}
function alertError(error){
 if(error&&error.status===401)return;        // сессия закончилась — уже показан экран входа
 uiHaptic('error');
 notify(errText(error));
}
async function load(spinner){
 if(S.loading)return;
 S.loading=true;
 const seq=++S.seq;
 if(spinner||!S.state){S.state=null;render();}
 // бесплатный сервер засыпает: первый запрос может идти долго, предупреждаем
 const wake=setTimeout(()=>{
  const label=document.querySelector('#budgetBody .loader-wrap div:last-child');
  if(!S.state&&label)label.textContent='Сервер просыпается, это может занять до минуты…';
 },6000);
 try{
  const data=await get('/api/budget/periods');
  if(seq!==S.seq)return;        // пока грузилось, пользователь уже что-то изменил — не затираем свежее
  adopt(data);
  render();
 }catch(error){
  if(error&&error.status===401)return;
  if(seq===S.seq&&!S.state){S.dragging=false;$('budgetBody').innerHTML=errorHtml(errText(error));}
 }finally{
  clearTimeout(wake);
  S.loading=false;
 }
}
function setBusy(on){
 S.busy=on;
 document.querySelectorAll('#budgetBody .bd-add,#budgetBody .bd-month-add').forEach(b=>{b.disabled=on;});
}
// Изменение без формы (месяц, порядок): блокирует повторные нажатия, обновляет экран ответом сервера.
async function mutate(action,extra){
 if(S.busy)return null;
 setBusy(true);
 S.seq++;
 try{
  const data=await call(action,extra);
  S.seq++;
  adopt(data,data.focus);
  S.busy=false;
  render();
  uiHaptic('success');
  return data;
 }catch(error){
  S.busy=false;
  alertError(error);
  if(error&&(error.status===404||error.status===409))load(false);
  else render();
  return null;
 }
}

function parseMoney(raw,title){
 const t=String(raw||'').replace(/[\s\u00a0₽]/g,'').replace(',','.');
 if(!t)return {error:title+': укажи сумму'};
 if(!/^\d+(\.\d{1,2})?$/.test(t))return {error:title+': только число, например 1500 или 1500,50'};
 const n=Number(t);
 if(!(n<=1e9))return {error:title+': слишком большая сумма'};
 return {value:n};
}
// Суммы в полях ввода показываются с пробелами между тысячами: 1 500, 120 000, 1 234 567,50
const groupDigits=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function amountText(n){
 const parts=String(n).split('.');
 return groupDigits(parts[0])+(parts[1]?','+parts[1]:'');
}
// При наборе сумма сразу приобретает разряды; курсор остаётся рядом с тем, что было введено.
function formatMoneyInput(el){
 const raw=el.value;
 const pos=el.selectionStart===null?raw.length:el.selectionStart;
 const before=raw.slice(0,pos).replace(/[^\d.,]/g,'').length;      // сколько цифр и запятых слева от курсора
 const cleaned=raw.replace(/[^\d.,]/g,'');
 const cut=cleaned.search(/[.,]/);
 let whole=cut<0?cleaned:cleaned.slice(0,cut);
 const frac=cut<0?null:cleaned.slice(cut+1).replace(/[.,]/g,'').slice(0,2);
 whole=whole.replace(/^0+(?=\d)/,'');
 const out=groupDigits(whole)+(frac===null?'':','+frac);
 if(out===raw)return;
 el.value=out;
 let seen=0,at=0;
 while(at<out.length&&seen<before){if(/[\d,]/.test(out[at]))seen++;at++;}
 try{el.setSelectionRange(at,at);}catch(e){}
}
$('bdFormBody').addEventListener('input',e=>{
 if(e.target.matches('input[inputmode="decimal"]'))formatMoneyInput(e.target);
});

// ---------- отметка «выполнено» ----------
// Кружок слева от статьи: сначала меняем экран (быстро), потом сохраняем на сервере.
// Запросы идут по очереди, чтобы быстрые нажатия не перепутались; при ошибке возвращаем прежнее состояние.
let doneChain=Promise.resolve();
function toggleDone(id){
 if(S.dragging||!S.state)return;
 const p=current();
 const it=p&&p.items.find(x=>x.id===id);
 if(!it)return;
 const next=!it.done;
 it.done=next;
 render();
 selectionHaptic();
 S.doneOps++;
 doneChain=doneChain.then(async()=>{
  try{
   const data=await call('item/done',{id,done:next});
   S.doneOps--;
   if(S.doneOps===0&&!S.busy&&!S.dragging&&isOpen()){S.seq++;adopt(data);render();}
  }catch(error){
   S.doneOps--;
   alertError(error);
   if(!(error&&error.status===401))load(false);
  }
 });
}

function selectPeriod(date){
 if(date===S.sel)return;
 S.sel=date;
 render();

function stepMonth(dir){
 const st=S.state;
 if(!st||!st.periods.length)return;
 const {first,last}=monthBounds();
 const p=current();
 const cur=S.ghost||(p&&p.month);
 if(!cur)return;
 const have=new Set(st.periods.map(x=>x.month));
 let ti=monthIdx(cur)+dir;
 while(ti>=monthIdx(first)&&ti<=monthIdx(last)&&!have.has(keyOf(ti)))ti+=dir;   // пропускаем «дыры» в таблице
 if(ti<monthIdx(first)||ti>monthIdx(last)+MAX_AHEAD)return;
 const target=keyOf(ti);
 if(!have.has(target)){S.ghost=target;render();selectionHaptic();return;}   // дальше последнего месяца — пустой экран
 const inTarget=st.periods.filter(x=>x.month===target);
 let idx;
 if(S.ghost)idx=dir<0?inTarget.length-1:0;
 else{
  const was=st.periods.filter(x=>x.month===p.month).findIndex(x=>x.pay_date===p.pay_date);
  idx=Math.min(Math.max(was,0),inTarget.length-1);
 }
 S.ghost=null;
 S.sel=inTarget[idx].pay_date;
 render();
 selectionHaptic();
}

const host=$('budgetBody');
host.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');
 if(t){
  if(t.disabled)return;
  switch(t.dataset.act){
   case 'tab':selectPeriod(t.dataset.date);break;
   case 'prev':stepMonth(-1);break;
   case 'next':stepMonth(1);break;
   case 'salary':openSalary();break;
   case 'add':openAddItem();break;
   case 'create':createMonths(t.dataset.month);break;
   case 'first':openFirstMonth();break;
   case 'retry':load(true);break;
   case 'done':toggleDone(Number(t.dataset.id));break;
  }
  return;
 }
 if(S.noClick)return;
 const row=e.target.closest('.bd-row');
 if(row)openEditItem(Number(row.dataset.id));
});

// ---------- перетаскивание статей ----------
// Порядок меняется долгим нажатием на строку в любом месте: удерживаешь HOLD_MS (2 секунды) — строка мерцает,
// потом «поднимается», и её можно тащить. Короткое нажатие по-прежнему открывает окно статьи.
(function initDrag(){
 const HOLD_MS=2000;
 let d=null,press=null,raf=0,lastY=0;
 const swipes=()=>{};
 // постоянный слушатель: пока тащим строку, страница не должна прокручиваться пальцем
 host.addEventListener('touchmove',ev=>{if(d&&ev.cancelable)ev.preventDefault();},{passive:false});
 function update(){
  if(!d)return;
  const sy=window.scrollY;
  const lo=d.tops[0]-d.tops[d.from],hi=d.tops[d.rows.length-1]-d.tops[d.from];
  const dy=Math.max(lo,Math.min(hi,lastY+sy-d.y0));
  d.row.style.transform='translateY('+dy+'px) scale(1.02)';
  // строки одной высоты: новая позиция — на сколько строк сдвинули, но в пределах списка
  const to=Math.max(0,Math.min(d.rows.length-1,d.from+Math.round(dy/d.h)));
  if(to===d.to)return;
  d.to=to;
  selectionHaptic();
  d.rows.forEach((r,i)=>{
   if(i===d.from)return;
   let shift=0;
   if(d.from<to&&i>d.from&&i<=to)shift=-d.h;
   else if(d.from>to&&i>=to&&i<d.from)shift=d.h;
   r.style.transform=shift?'translateY('+shift+'px)':'';
  });
 }
 function tick(){
  if(!d)return;
  // у края экрана страница сама прокручивается, чтобы длинный список можно было переставить целиком
  if(lastY<80)window.scrollBy(0,-12);
  else if(lastY>window.innerHeight-90)window.scrollBy(0,12);
  update();
  raf=requestAnimationFrame(tick);
 }
 function start(list,row,pointerId,clientY,handle){
  if(S.busy||S.dragging)return false;
  const rows=[...list.querySelectorAll('.bd-row')];
  if(rows.length<2)return false;
  const sy=window.scrollY;
  const tops=rows.map(r=>r.getBoundingClientRect().top+sy);
  const from=rows.indexOf(row);
  d={id:pointerId,list,row,rows,tops,from,to:from,y0:clientY+sy,h:row.getBoundingClientRect().height,handle};
  lastY=clientY;
  try{handle.setPointerCapture(pointerId);}catch(_){}
  row.classList.add('lifted');
  S.dragging=true;
  swipes(false);
  uiHaptic('success');
  raf=requestAnimationFrame(tick);
  return true;
 }
 function cancelHold(){
  if(!press)return;
  clearTimeout(press.timer);
  clearTimeout(press.visual);
  press.row.classList.remove('holding');
  press=null;
 }
 host.addEventListener('pointerdown',e=>{
  if(d||(e.pointerType==='mouse'&&e.button!==0))return;
  if(e.target.closest('.bd-check'))return;               // кружок «выполнено» — отдельная кнопка
  const row=e.target.closest('.bd-row');
  const list=row&&row.closest('.bd-list');
  if(!row||!list||S.busy||S.dragging)return;
  if(list.querySelectorAll('.bd-row').length<2)return;   // одну статью переставлять некуда
  cancelHold();
  const p={id:e.pointerId,ox:e.clientX,oy:e.clientY,y:e.clientY,row};
  // Мерцать начинаем не сразу, а через 0,35 с: короткое нажатие (открыть окно) не должно мигать.
  p.visual=setTimeout(()=>{if(press===p&&row.isConnected)row.classList.add('holding');},350);
  p.timer=setTimeout(()=>{
   if(press!==p)return;
   press=null;
   row.classList.remove('holding');
   if(!row.isConnected)return;          // экран успели перерисовать — начинать нечего
   start(list,row,p.id,p.y,row);
  },HOLD_MS);
  press=p;
 });
 host.addEventListener('pointermove',e=>{
  if(press&&e.pointerId===press.id){
   press.y=e.clientY;
   // палец ушёл в сторону до конца удержания — это не перетаскивание
   if(Math.abs(e.clientX-press.ox)>12||Math.abs(e.clientY-press.oy)>12)cancelHold();
   return;
  }
  if(!d||e.pointerId!==d.id)return;
  lastY=e.clientY;
  update();
 });
 host.addEventListener('contextmenu',e=>{if(e.target.closest('.bd-row'))e.preventDefault();});
 const end=e=>{
  if(press&&e.pointerId===press.id)cancelHold();
  if(!d||e.pointerId!==d.id)return;
  const g=d;
  d=null;
  cancelAnimationFrame(raf);
  try{g.handle.releasePointerCapture(g.id);}catch(_){}
  swipes(true);
  S.noClick=true;
  setTimeout(()=>{S.noClick=false;},350);
  g.row.style.transform='translateY('+((g.to-g.from)*g.h)+'px)';
  g.row.classList.remove('lifted');
  setTimeout(()=>{
   const rows=[...g.list.querySelectorAll('.bd-row')];
   g.list.classList.add('noanim');
   rows.forEach(r=>{r.style.transform='';});
   S.dragging=false;
   if(g.to!==g.from&&g.list.isConnected){
    const ref=rows[g.to>g.from?g.to+1:g.to]||null;
    g.list.insertBefore(g.row,ref);
    commitOrder([...g.list.querySelectorAll('.bd-row')].map(r=>Number(r.dataset.id)));
   }else if(S.pendingRender){
    render();
   }
   S.pendingRender=false;
   requestAnimationFrame(()=>requestAnimationFrame(()=>g.list.classList.remove('noanim')));
  },240);
 };
 host.addEventListener('pointerup',end);
 host.addEventListener('pointercancel',end);
})();

async function commitOrder(ids){
 const p=current();
 if(!p)return;
 const before=p.items.slice();
 const byId=new Map(before.map(i=>[i.id,i]));
 p.items=ids.map(id=>byId.get(id)).filter(Boolean);      // экран уже показывает новый порядок
 setBusy(true);
 S.seq++;
 try{
  const data=await call('reorder',{pay_date:p.pay_date,ids});
  S.seq++;
  adopt(data,data.focus);
  S.busy=false;
  render();
  uiHaptic('success');
 }catch(error){
  S.busy=false;
  p.items=before;
  render();
  alertError(error);
  if(error&&(error.status===404||error.status===409))load(false);
 }
}

// ---------- вход и выход ----------
function formOpen(){return $('budgetFormBackdrop').classList.contains('visible');}
window.Budget={
 open(){
  hideKeyboard();
  window.scrollTo(0,0);
  S.sel=null;                           // каждый раз начинаем с ближайшей будущей зарплаты
  S.ghost=null;
  if(S.state){adopt(S.state);render();} // сразу показываем то, что уже загружали, свежее подтянется следом
  load(false);
 },
 // вернулись на вкладку: подтягиваем изменения, сделанные с другого устройства
 refresh(){
  if(!isOpen()||!S.state||S.busy||S.dragging||S.doneOps>0||asking||formOpen())return;
  load(false);
 },
 // выход: ничего из бюджета не остаётся на экране
 close(){
  S.seq++;
  S.state=null;S.sel=null;S.ghost=null;S.busy=false;S.dragging=false;
  S.doneOps=0;
  setSheetLink(null);
  form.busy=false;
  $('budgetFormBackdrop').classList.remove('visible');
  if(asking)closeSheet(null);
  $('budgetBody').innerHTML='';
 }
};
})();

boot();
</script>
